<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VNX</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="app">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <button class="new-chat-btn" id="newChatBtn">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 1V15M1 8H15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          Obrolan baru
        </button>
      </div>
      <div class="sidebar-history" id="sidebarHistory">
        <div class="sidebar-label">Riwayat</div>
        <div class="history-empty" id="historyEmpty">Belum ada percakapan</div>
        <ul class="history-list" id="historyList"></ul>
      </div>
      <div class="sidebar-bottom">
        <div class="brand-mark">
          <span class="brand-dot"></span> VNX
        </div>
      </div>
    </aside>

    <!-- Main chat area -->
    <main class="main">

      <header class="topbar">
        <button class="icon-btn" id="sidebarToggle" aria-label="Buka riwayat">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="2" y="4" width="14" height="1.4" rx="0.7" fill="currentColor"/><rect x="2" y="8.3" width="14" height="1.4" rx="0.7" fill="currentColor"/><rect x="2" y="12.6" width="14" height="1.4" rx="0.7" fill="currentColor"/></svg>
        </button>
        <div class="topbar-title">VNX</div>
        <div class="topbar-spacer"></div>
      </header>

      <section class="chat-scroll" id="chatScroll">
        <div class="empty-state" id="emptyState">
          <div class="empty-mark">VNX</div>
          <p class="empty-sub">Tanya apa saja. Jawaban langsung, tanpa basa-basi.</p>
        </div>
        <div class="messages" id="messages"></div>
      </section>

      <div class="composer-wrap">
        <form class="composer" id="composerForm">
          <textarea
            id="composerInput"
            class="composer-input"
            placeholder="Kirim pesan ke VNX"
            rows="1"
            autocomplete="off"
          ></textarea>
          <button type="submit" class="send-btn" id="sendBtn" aria-label="Kirim" disabled>
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 13V3M8 3L3 8M8 3L13 8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </form>
        <div class="composer-hint">VNX bisa saja salah. Periksa info penting.</div>
      </div>

    </main>
  </div>

  <script src="js/chat.js"></script>
</body>
</html>
